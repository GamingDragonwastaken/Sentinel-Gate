[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelgate"
version = "1.0.0"
authors = [
  { name="SentinelGate Team", email="team@sentinelgate.example.com" },
]
description = "Enterprise AI Security Gateway"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.35.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0"
]

[project.scripts]
sentinelgate = "sentinelgate.cli:main"

[tool.setuptools.packages.find]
include = ["sentinelgate*"]
